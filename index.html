<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  
  <style>
    /* ========================================
       CSS CUSTOM PROPERTIES - THEME SYSTEM
       ======================================== */
    
    :root {
      /* Light Theme Colors */
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-primary: #333333;
      --text-secondary: #666666;
      --border-color: #dddddd;
      --accent-color: #4CAF50;
      --error-color: #f44336;
      --shadow: rgba(0, 0, 0, 0.1);
      
      /* Spacing */
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 1.5rem;
      --spacing-lg: 2rem;
      
      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-size-base: 16px;
      --font-size-lg: 1.25rem;
      --font-size-xl: 2rem;
      
      /* Transitions */
      --transition-speed: 300ms;
    }
    
    [data-theme="dark"] {
      /* Dark Theme Colors */
      --bg-primary: #1e1e1e;
      --bg-secondary: #2d2d2d;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border-color: #404040;
      --accent-color: #66BB6A;
      --error-color: #ef5350;
      --shadow: rgba(0, 0, 0, 0.3);
    }
    
    /* Apply smooth transitions to all elements for theme switching */
    * {
      transition: background-color var(--transition-speed),
                  color var(--transition-speed),
                  border-color var(--transition-speed);
    }
    
    
    /* ========================================
       GLOBAL STYLES
       ======================================== */
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--text-primary);
      background-color: var(--bg-secondary);
      line-height: 1.6;
    }
    
    
    /* ========================================
       APP CONTAINER
       ======================================== */
    
    .app-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    
    /* ========================================
       HEADER & FOOTER
       ======================================== */
    
    .app-header {
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      padding: var(--spacing-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 4px var(--shadow);
    }
    
    .app-header h1 {
      font-size: var(--font-size-xl);
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }
    
    #theme-toggle {
      background: none;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-sm);
      cursor: pointer;
      font-size: 1.5rem;
      /* Minimum touch target size: 44px */
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #theme-toggle:hover {
      border-color: var(--accent-color);
    }
    
    #theme-toggle:active {
      transform: scale(0.95);
    }
    
    #theme-toggle:focus {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }
    
    .icon-moon {
      display: none;
    }
    
    [data-theme="dark"] .icon-sun {
      display: none;
    }
    
    [data-theme="dark"] .icon-moon {
      display: inline;
    }
    
    .app-footer {
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      padding: var(--spacing-md);
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-top: auto;
    }
    
    
    /* ========================================
       MAIN LAYOUT - CSS GRID
       ======================================== */
    
    .app-main {
      flex: 1;
      padding: var(--spacing-md);
      max-width: 1920px;
      width: 100%;
      margin: 0 auto;
    }
    
    /* Mobile Layout (< 768px): Single Column */
    @media (max-width: 767px) {
      .app-main {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--spacing-md);
        grid-template-areas:
          "balance"
          "form"
          "categories"
          "list"
          "chart"
          "summary";
      }
      
      #balance-section {
        grid-area: balance;
      }
      
      #form-section {
        grid-area: form;
      }
      
      #category-section {
        grid-area: categories;
      }
      
      #list-section {
        grid-area: list;
      }
      
      #chart-section {
        grid-area: chart;
      }
      
      #summary-section {
        grid-area: summary;
      }
    }
    
    /* Desktop Layout (≥ 768px): Two Columns */
    @media (min-width: 768px) {
      .app-main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--spacing-md);
        grid-template-areas:
          "balance balance"
          "form chart"
          "categories chart"
          "list summary";
      }
      
      #balance-section {
        grid-area: balance;
      }
      
      #form-section {
        grid-area: form;
      }
      
      #category-section {
        grid-area: categories;
      }
      
      #list-section {
        grid-area: list;
      }
      
      #chart-section {
        grid-area: chart;
      }
      
      #summary-section {
        grid-area: summary;
      }
    }
    
    
    /* ========================================
       CARD COMPONENT
       ======================================== */
    
    .card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: var(--spacing-md);
      box-shadow: 0 2px 4px var(--shadow);
    }
    
    .card h2 {
      font-size: var(--font-size-lg);
      font-weight: 600;
      margin-top: 0;
      margin-bottom: var(--spacing-md);
      color: var(--text-primary);
    }
    
    
    /* ========================================
       RESPONSIVE UTILITIES
       ======================================== */
    
    /* Ensure no horizontal scrolling on any viewport */
    .app-container,
    .app-main,
    .card {
      max-width: 100%;
      overflow-x: hidden;
    }
    
    /* Adjust header on small mobile screens (320px) */
    @media (max-width: 374px) {
      .app-header h1 {
        font-size: 1.5rem;
      }
      
      .app-header {
        padding: var(--spacing-sm);
      }
      
      .app-main {
        padding: var(--spacing-sm);
      }
    }
    
    
    /* ========================================
       FORM COMPONENTS
       ======================================== */
    
    .form-group {
      margin-bottom: var(--spacing-md);
      position: relative;
    }
    
    .form-group label {
      display: block;
      margin-bottom: var(--spacing-xs);
      color: var(--text-primary);
      font-weight: 500;
      font-size: var(--font-size-base);
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: var(--spacing-sm);
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      color: var(--text-primary);
      background-color: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      transition: border-color var(--transition-speed),
                  box-shadow var(--transition-speed),
                  background-color var(--transition-speed);
      box-sizing: border-box;
    }
    
    .form-group input:hover,
    .form-group select:hover {
      border-color: var(--accent-color);
    }
    
    /* Focus indicators for accessibility */
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }
    
    [data-theme="dark"] .form-group input:focus,
    [data-theme="dark"] .form-group select:focus {
      box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);
    }
    
    /* Error state styling */
    .form-group.error input,
    .form-group.error select {
      border-color: var(--error-color);
    }
    
    .form-group.error input:focus,
    .form-group.error select:focus {
      box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.2);
    }
    
    [data-theme="dark"] .form-group.error input:focus,
    [data-theme="dark"] .form-group.error select:focus {
      box-shadow: 0 0 0 3px rgba(239, 83, 80, 0.2);
    }
    
    /* Error message styling */
    .error-message {
      display: block;
      margin-top: var(--spacing-xs);
      color: var(--error-color);
      font-size: 0.875rem;
      min-height: 1.25rem;
      transition: opacity var(--transition-speed);
    }
    
    .error-message:empty {
      opacity: 0;
    }
    
    
    /* ========================================
       BUTTON STYLES
       ======================================== */
    
    .btn-primary,
    .btn-secondary {
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity var(--transition-speed),
                  transform 100ms ease,
                  background-color var(--transition-speed);
      min-height: 44px; /* Touch target accessibility */
      min-width: 44px;
    }
    
    .btn-primary {
      background-color: var(--accent-color);
      color: #ffffff;
    }
    
    .btn-primary:hover {
      opacity: 0.9;
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }
    
    .btn-primary:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
    }
    
    [data-theme="dark"] .btn-primary:focus {
      box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.3);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
    }
    
    .btn-secondary:hover {
      background-color: var(--border-color);
    }
    
    .btn-secondary:active {
      transform: scale(0.98);
    }
    
    .btn-secondary:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }
    
    [data-theme="dark"] .btn-secondary:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }
    
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    
    /* ========================================
       TRANSACTION LIST STYLES
       ======================================== */
    
    .transaction-container {
      max-height: 400px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .transaction-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-sm);
      margin-bottom: var(--spacing-xs);
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      transition: background-color var(--transition-speed),
                  opacity var(--transition-speed),
                  transform var(--transition-speed);
    }
    
    .transaction-item:hover {
      background-color: var(--border-color);
    }
    
    .transaction-item.deleting {
      opacity: 0;
      transform: translateX(-20px);
    }
    
    .transaction-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }
    
    .transaction-name {
      font-weight: 500;
      color: var(--text-primary);
      font-size: var(--font-size-base);
    }
    
    .transaction-details {
      display: flex;
      gap: var(--spacing-sm);
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    
    .transaction-amount {
      font-weight: 600;
      color: var(--accent-color);
    }
    
    .transaction-category {
      color: var(--text-secondary);
    }
    
    .transaction-delete {
      background-color: transparent;
      border: none;
      color: var(--error-color);
      font-size: 1.25rem;
      cursor: pointer;
      padding: var(--spacing-xs);
      min-width: 44px;
      min-height: 44px;
      border-radius: 4px;
      transition: background-color var(--transition-speed),
                  transform 100ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .transaction-delete:hover {
      background-color: rgba(244, 67, 54, 0.1);
    }
    
    .transaction-delete:active {
      transform: scale(0.95);
    }
    
    .transaction-delete:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.2);
    }
    
    [data-theme="dark"] .transaction-delete:hover {
      background-color: rgba(239, 83, 80, 0.1);
    }
    
    [data-theme="dark"] .transaction-delete:focus {
      box-shadow: 0 0 0 3px rgba(239, 83, 80, 0.2);
    }
    
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: var(--spacing-lg);
      color: var(--text-secondary);
    }
    
    .empty-state .empty-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: var(--spacing-sm);
      opacity: 0.5;
    }
    
    .empty-hint {
      font-size: 0.875rem;
      margin-top: var(--spacing-xs);
      opacity: 0.7;
    }
    
    
    /* ========================================
       CATEGORY MANAGER STYLES
       ======================================== */
    
    .category-list {
      margin-bottom: var(--spacing-md);
      padding: var(--spacing-sm);
      background-color: var(--bg-secondary);
      border-radius: 4px;
      min-height: 40px;
      color: var(--text-primary);
      font-size: 0.875rem;
    }
    
    .category-input-group {
      display: flex;
      gap: var(--spacing-sm);
    }
    
    .category-input-group input {
      flex: 1;
      padding: var(--spacing-sm);
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      color: var(--text-primary);
      background-color: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      transition: border-color var(--transition-speed),
                  box-shadow var(--transition-speed);
    }
    
    .category-input-group input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }
    
    [data-theme="dark"] .category-input-group input:focus {
      box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);
    }
    
    
    /* ========================================
       INTERACTIVE ELEMENT TRANSITIONS
       ======================================== */
    
    /* Smooth transitions for all interactive elements */
    button,
    input,
    select,
    .transaction-item {
      transition: all var(--transition-speed) ease;
    }
    
    /* Focus visible for keyboard navigation (Task 13.2) */
    /* Ensure all focusable elements have visible focus indicators */
    *:focus {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }
    
    /* Enhanced focus for buttons and interactive elements */
    button:focus,
    a:focus,
    input:focus,
    select:focus,
    .transaction-delete:focus {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }
    
    /* Skip default browser focus for consistency */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--accent-color);
      outline-offset: 2px;
    }
    
    /* Prevent transition on page load */
    .no-transition * {
      transition: none !important;
    }
    
    /* ========================================
       BALANCE DISPLAY STYLES
       ======================================== */
    
    .balance-amount {
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      color: var(--accent-color);
      padding: var(--spacing-md) 0;
      transition: color var(--transition-speed),
                  background-color var(--transition-speed);
      border-radius: 8px;
    }
    
    /* Negative balance in red */
    .balance-amount.negative {
      color: var(--error-color);
    }
    
    /* Highlight animation when balance changes */
    @keyframes balance-highlight {
      0% {
        background-color: transparent;
      }
      50% {
        background-color: rgba(76, 175, 80, 0.15);
      }
      100% {
        background-color: transparent;
      }
    }
    
    [data-theme="dark"] @keyframes balance-highlight {
      0% {
        background-color: transparent;
      }
      50% {
        background-color: rgba(102, 187, 106, 0.15);
      }
      100% {
        background-color: transparent;
      }
    }
    
    .balance-amount.highlight {
      animation: balance-highlight 600ms ease-out;
    }
    
    /* Responsive font size for mobile */
    @media (max-width: 767px) {
      .balance-amount {
        font-size: 2.5rem;
      }
    }
    
    @media (max-width: 374px) {
      .balance-amount {
        font-size: 2rem;
      }
    }
    
    
    /* ========================================
       CHART WRAPPER STYLES
       ======================================== */
    
    .chart-wrapper {
      position: relative;
      min-height: 300px;
      max-height: 500px;
      padding: var(--spacing-md) 0;
    }
    
    /* Ensure canvas is responsive */
    .chart-wrapper canvas {
      max-width: 100%;
      height: auto !important;
    }
    
    /* Chart empty state */
    .chart-empty-state {
      text-align: center;
      padding: var(--spacing-lg);
      color: var(--text-secondary);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .chart-empty-state .empty-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: var(--spacing-sm);
      opacity: 0.5;
    }
    
    /* Responsive adjustments for mobile */
    @media (max-width: 767px) {
      .chart-wrapper {
        min-height: 250px;
        max-height: 400px;
      }
      
      .chart-empty-state {
        min-height: 250px;
      }
    }
    
    
    /* ========================================
       MONTHLY SUMMARY STYLES
       ======================================== */
    
    .month-selector {
      margin-bottom: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }
    
    .month-selector label {
      font-weight: 500;
      color: var(--text-primary);
      font-size: var(--font-size-base);
    }
    
    .month-selector select {
      padding: var(--spacing-sm);
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      color: var(--text-primary);
      background-color: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color var(--transition-speed),
                  box-shadow var(--transition-speed);
    }
    
    .month-selector select:hover {
      border-color: var(--accent-color);
    }
    
    .month-selector select:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }
    
    [data-theme="dark"] .month-selector select:focus {
      box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);
    }
    
    .summary-content {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .summary-category-row {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      padding: var(--spacing-sm);
      background-color: var(--bg-secondary);
      border-radius: 4px;
      border: 1px solid var(--border-color);
      transition: background-color var(--transition-speed);
    }
    
    .summary-category-row:hover {
      background-color: var(--border-color);
    }
    
    .summary-category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      color: var(--text-primary);
    }
    
    .summary-category-name {
      font-size: var(--font-size-base);
    }
    
    .summary-category-amount {
      font-weight: 600;
      color: var(--accent-color);
      font-size: var(--font-size-base);
    }
    
    .summary-category-bar {
      width: 100%;
      height: 8px;
      background-color: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .summary-category-bar-fill {
      height: 100%;
      background-color: var(--accent-color);
      border-radius: 4px;
      transition: width 300ms ease-out;
    }
    
    .summary-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) var(--spacing-sm);
      margin-top: var(--spacing-sm);
      border-top: 2px solid var(--border-color);
      font-weight: 600;
      font-size: var(--font-size-lg);
      color: var(--text-primary);
    }
    
    .summary-total-label {
      color: var(--text-primary);
    }
    
    .summary-total-amount {
      color: var(--accent-color);
    }
    
    .summary-empty-state {
      text-align: center;
      padding: var(--spacing-lg);
      color: var(--text-secondary);
    }
    
    .summary-empty-state .empty-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: var(--spacing-sm);
      opacity: 0.5;
    }
    
    /* Responsive adjustments for monthly summary */
    @media (max-width: 767px) {
      .summary-category-header {
        font-size: 0.875rem;
      }
      
      .summary-total-row {
        font-size: 1.125rem;
      }
    }
    
    
    /* ========================================
       TOAST NOTIFICATION SYSTEM
       ======================================== */
    
    #toast-container {
      position: fixed;
      top: 80px;
      right: var(--spacing-md);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      max-width: 400px;
    }
    
    .toast {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-md);
      background-color: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-left: 4px solid var(--accent-color);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      animation: toast-slide-in 300ms ease-out;
      min-width: 280px;
    }
    
    @keyframes toast-slide-in {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes toast-slide-out {
      from {
        transform: translateX(0);
        opacity: 1;

      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }

      animation: toast-slide-out 300ms ease-out;
    }
    
    .toast-error {

      width: 24px;

    .toast-close:hover {

      color: var(--text-primary);

    /* Mobile adjustments for toasts */
    @media (max-width: 767px) {
      #toast-container {
        top: auto;
        bottom: var(--spacing-md);
        right: var(--spacing-sm);
        left: var(--spacing-sm);

      .toast {
        min-width: auto;
      }

    /* ========================================
       STORAGE UNAVAILABLE BANNER
       ======================================== */
    
    #storage-banner {
      display: none;
      background-color: #ff9800;
      color: #ffffff;

    /* Additional CSS will be added in subsequent tasks */

       ACCESSIBILITY - VISUALLY HIDDEN

  <script>
    // ========================================
    // EXPENSE & BUDGET VISUALIZER
    // Single-Page Application with Vanilla JavaScript
    // ========================================
    
    (function() {
      'use strict';
      
      // ========================================
      // UTILITY FUNCTIONS
      // ========================================
      const Utils = (function() {
        /**
         * Debounces a function call - delays execution until after the wait time has elapsed
         * since the last invocation.
         * Task 14.1: Add debounce function for real-time validation (300ms delay)
         * 
         * @param {Function} func - The function to debounce
         * @param {number} wait - Wait time in milliseconds
         * @returns {Function} Debounced function
         */
        function debounce(func, wait) {
          let timeout;
          return function executedFunction(...args) {
            const later = () => {
              clearTimeout(timeout);
              func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
          };
        }
        
        /**
         * Throttles a function call - ensures function is called at most once per wait period.
         * Useful for performance optimization of frequently fired events.
         * 
         * @param {Function} func - The function to throttle
         * @param {number} wait - Wait time in milliseconds
         * @returns {Function} Throttled function
         */
        function throttle(func, wait) {
          let inThrottle;
          return function executedFunction(...args) {
            if (!inThrottle) {
              func(...args);
              inThrottle = true;
              setTimeout(() => inThrottle = false, wait);
            }
          };
        }
        
        // Public API
        return {
          debounce: debounce,
          throttle: throttle
        };
      })();
      
      
      // ========================================
      // PERFORMANCE MONITOR MODULE
      // Task 14.2: Add performance.now() timestamps to measure critical operations
      // Task 14.2: Log warnings if operations exceed time budgets
      // ========================================
      const PerformanceMonitor = (function() {
        // Time budget thresholds (in milliseconds)
        const TIME_BUDGETS = {
          addTransaction: 1000,      // 1 second
          deleteTransaction: 1000,   // 1 second
          uiUpdate: 300,             // 300ms
          initialLoad: 2000,         // 2 seconds
          dataLoad: 500              // 500ms
        };
        
        // Active measurements
        const measurements = {};
        
        /**
         * Starts a performance measurement.
         * Task 14.2: Add performance.now() timestamps
         * 
         * @param {string} operationName - Name of the operation being measured
         * @returns {number} Start timestamp
         */
        function start(operationName) {
          const timestamp = performance.now();
          measurements[operationName] = timestamp;
          return timestamp;
        }
        
        /**
         * Ends a performance measurement and logs if budget is exceeded.
         * Task 14.2: Log warnings to console if operations exceed time budgets
         * 
         * @param {string} operationName - Name of the operation being measured
         * @param {string} budgetType - Type of time budget to check against
         * @returns {number} Duration in milliseconds
         */
        function end(operationName, budgetType) {
          const endTime = performance.now();
          const startTime = measurements[operationName];
          
          if (!startTime) {
            console.warn('PerformanceMonitor: No start time found for', operationName);
            return 0;
          }
          
          const duration = endTime - startTime;
          const budget = TIME_BUDGETS[budgetType];
          
          // Log performance measurement
          console.log(`[Performance] ${operationName}: ${duration.toFixed(2)}ms`);
          
          // Check if budget was exceeded
          if (budget && duration > budget) {
            console.warn(`[Performance Warning] ${operationName} exceeded time budget!`);
            console.warn(`  Duration: ${duration.toFixed(2)}ms`);
            console.warn(`  Budget: ${budget}ms`);
            console.warn(`  Exceeded by: ${(duration - budget).toFixed(2)}ms`);
          }
          
          // Clean up measurement
          delete measurements[operationName];
          
          return duration;
        }
        
        /**
         * Measures a synchronous function execution.
         * 
         * @param {string} operationName - Name of the operation
         * @param {Function} func - Function to measure
         * @param {string} budgetType - Type of time budget to check
         * @returns {*} Result of the function
         */
        function measure(operationName, func, budgetType) {
          start(operationName);
          const result = func();
          end(operationName, budgetType);
          return result;
        }
        
        /**
         * Logs current time budgets for reference.
         */
        function logBudgets() {
          console.log('[Performance] Time Budgets:');
          Object.entries(TIME_BUDGETS).forEach(([operation, budget]) => {
            console.log(`  ${operation}: ${budget}ms`);
          });
        }
        
        // Public API
        return {
          start: start,
          end: end,
          measure: measure,
          logBudgets: logBudgets,
          TIME_BUDGETS: TIME_BUDGETS
        };
      })();
      
      
      // ========================================
      // STORAGE MANAGER MODULE
      // ========================================
      const StorageManager = (function() {
        // Check if Local Storage is available (detects private browsing mode)
        const STORAGE_AVAILABLE = checkStorageAvailability();
        
        // Storage event listeners
        const listeners = {};
        
        /**
         * Checks if Local Storage is available and functional.
         * Returns false in private browsing mode or when storage is disabled.
         * @returns {boolean} True if storage is available, false otherwise
         */
        function checkStorageAvailability() {
          try {
            const test = '__storage_test__';
            localStorage.setItem(test, test);
            localStorage.removeItem(test);
            return true;
          } catch (e) {
            console.warn('Local Storage is not available:', e);
            console.error('Storage Error Details:', {
              name: e.name,
              message: e.message,
              code: e.code
            });
            return false;
          }
        }
        
        /**
         * Registers an event listener for storage errors.
         * @param {string} eventName - Event name ('quota-exceeded' or 'unavailable')
         * @param {Function} callback - Callback function
         */
        function on(eventName, callback) {
          if (!listeners[eventName]) {
            listeners[eventName] = [];
          }
          listeners[eventName].push(callback);
        }
        
        /**
         * Emits a storage event to all registered listeners.
         * @param {string} eventName - Event name
         * @param {*} data - Event data
         */
        function emit(eventName, data) {
          if (listeners[eventName]) {
            listeners[eventName].forEach(function(callback) {
              try {
                callback(data);
              } catch (e) {
                console.error('Error in storage event listener:', e);
              }
            });
          }
        }
        
        /**
         * Saves data to Local Storage with version wrapper and JSON serialization.
         * Handles quota exceeded errors gracefully.
         * Requirements: 12.1 - Console error logging with details
         * @param {string} key - Storage key (e.g., 'ebv_transactions_v1')
         * @param {*} data - Data to store (will be JSON serialized)
         * @returns {boolean} True if save succeeded, false otherwise
         */
        function save(key, data) {
          if (!STORAGE_AVAILABLE) {
            console.error('Storage save failed: Local Storage not available');
            console.error('Storage Error Details:', {
              key: key,
              reason: 'Local Storage is not available or disabled',
              timestamp: new Date().toISOString()
            });
            emit('unavailable', { key: key, operation: 'save' });
            return false;
          }
          
          try {
            const wrapper = { 
              version: "1.0", 
              data: data 
            };
            const serialized = JSON.stringify(wrapper);
            localStorage.setItem(key, serialized);
            return true;
          } catch (e) {
            // Handle quota exceeded error (Requirement 5.5, 12.1)
            if (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) {
              console.error('Storage quota exceeded:', e);
              console.error('Storage Error Details:', {
                key: key,
                errorName: e.name,
                errorCode: e.code,
                errorMessage: e.message,
                dataSize: serialized ? serialized.length : 'unknown',
                timestamp: new Date().toISOString(),
                recommendation: 'Delete old transactions to free up space'
              });
              emit('quota-exceeded', { key: key, error: e });
            } else {
              console.error('Storage save failed:', e);
              console.error('Storage Error Details:', {
                key: key,
                errorName: e.name,
                errorCode: e.code,
                errorMessage: e.message,
                timestamp: new Date().toISOString()
              });
            }
            return false;
          }
        }
        
        /**
         * Loads data from Local Storage with JSON parsing and error handling.
         * Requirements: 12.1 - Console error logging with details
         * Requirements: 12.3 - Handle data corruption with version checking
         * @param {string} key - Storage key to retrieve
         * @returns {{success: boolean, data: *|null, error: string|null}} Result object with success status, data, and error message
         */
        function load(key) {
          if (!STORAGE_AVAILABLE) {
            console.warn('Storage load skipped: Local Storage not available');
            return { success: false, data: null, error: 'Storage not available' };
          }
          
          try {
            const item = localStorage.getItem(key);
            if (!item) {
              // No data found - not an error, just empty
              return { success: true, data: null, error: null };
            }
            
            // Try to parse JSON (Requirement 12.3 - try-catch for JSON parse errors)
            let parsed;
            try {
              parsed = JSON.parse(item);
            } catch (parseError) {
              // JSON parse error - data is corrupted (Requirement 12.3)
              console.error('Data corruption detected - JSON parse failed for key:', key, parseError);
              console.error('Storage Error Details:', {
                key: key,
                errorName: parseError.name,
                errorMessage: parseError.message,
                timestamp: new Date().toISOString(),
                recommendation: 'Data is corrupted and cannot be recovered. Will fall back to defaults.'
              });
              return { 
                success: false, 
                data: null, 
                error: `Corrupted data: Invalid JSON format for ${key}` 
              };
            }
            
            // Verify version wrapper exists (Requirement 12.3 - version checking)
            if (parsed && typeof parsed === 'object' && parsed.version) {
              // Check version compatibility
              if (parsed.version === "1.0") {
                // Version 1.0 - current version
                return { success: true, data: parsed.data, error: null };
              } else {
                // Unknown version - may need migration in future
                console.warn('Unknown data version for key:', key, 'Version:', parsed.version);
                console.error('Storage Error Details:', {
                  key: key,
                  version: parsed.version,
                  expectedVersion: '1.0',
                  timestamp: new Date().toISOString(),
                  recommendation: 'Data version mismatch. Will fall back to defaults.'
                });
                return { 
                  success: false, 
                  data: null, 
                  error: `Incompatible data version ${parsed.version} for ${key}` 
                };
              }
            }
            
            // Fallback for data without version wrapper (legacy support)
            console.warn('Loaded data without version wrapper for key:', key);
            return { success: true, data: parsed, error: null };
          } catch (e) {
            // Unexpected error during load (Requirement 12.3 - log corruption errors)
            console.error('Unexpected storage load error for key:', key, e);
            console.error('Storage Error Details:', {
              key: key,
              errorName: e.name,
              errorMessage: e.message,
              timestamp: new Date().toISOString(),
              recommendation: 'Unexpected error occurred. Will fall back to defaults.'
            });
            return { 
              success: false, 
              data: null, 
              error: `Failed to load data from ${key}: ${e.message}` 
            };
          }
        }
        
        /**
         * Removes data from Local Storage.
         * @param {string} key - Storage key to remove
         * @returns {boolean} True if removal succeeded, false otherwise
         */
        function clear(key) {
          if (!STORAGE_AVAILABLE) {
            console.warn('Storage clear skipped: Local Storage not available');
            return false;
          }
          
          try {
            localStorage.removeItem(key);
            return true;
          } catch (e) {
            console.error('Storage clear failed for key:', key, e);
            console.error('Storage Error Details:', {
              key: key,
              errorName: e.name,
              errorMessage: e.message,
              timestamp: new Date().toISOString()
            });
            return false;
          }
        }
        
        /**
         * Checks if Local Storage is available.
         * @returns {boolean} True if storage is available, false otherwise
         */
        function isAvailable() {
          return STORAGE_AVAILABLE;
        }
        
        // Public API
        return {
          save: save,
          load: load,
          clear: clear,
          isAvailable: isAvailable,
          on: on
        };
      })();
      
      
      // ========================================
      // NOTIFICATION MANAGER MODULE
      // ========================================
      const NotificationManager = (function() {
        let toastContainer = null;
        let toastIdCounter = 0;
        
        /**
         * Initializes the NotificationManager.
         * Creates toast container if it doesn't exist.
         */
        function init() {
          toastContainer = document.getElementById('toast-container');
          if (!toastContainer) {
            console.warn('Toast container not found in DOM');
          }
        }
        
        /**
         * Shows a toast notification.
         * @param {string} message - Main message to display
         * @param {string} type - Toast type: 'error', 'warning', 'info', 'success'
         * @param {string} detail - Optional detail text
         * @param {number} duration - Duration in ms before auto-dismiss (0 = no auto-dismiss)
         * @returns {string} Toast ID for manual dismissal
         */
        function showToast(message, type = 'info', detail = '', duration = 5000) {
          if (!toastContainer) {
            console.error('NotificationManager not initialized');
            return null;
          }
          
          const toastId = 'toast-' + (++toastIdCounter);
          
          // Create toast element
          const toast = document.createElement('div');
          toast.className = 'toast toast-' + type;
          toast.id = toastId;
          toast.setAttribute('role', 'alert');
          
          // Select icon based on type
          let icon = 'ℹ️';
          if (type === 'error') icon = '⚠️';
          else if (type === 'warning') icon = '⚠️';
          else if (type === 'success') icon = '✓';
          
          // Build toast HTML
          let html = '<span class="toast-icon">' + icon + '</span>';
          html += '<div class="toast-content">';
          html += '<div class="toast-message">' + escapeHtml(message) + '</div>';
          if (detail) {
            html += '<div class="toast-detail">' + escapeHtml(detail) + '</div>';
          }
          html += '</div>';
          html += '<button class="toast-close" aria-label="Close notification">×</button>';
          
          toast.innerHTML = html;
          
          // Add to container
          toastContainer.appendChild(toast);
          
          // Set up close button
          const closeBtn = toast.querySelector('.toast-close');
          closeBtn.addEventListener('click', function() {
            dismissToast(toastId);
          });
          
          // Add Enter and Escape key handlers for close button (Task 13.2)
          closeBtn.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === 'Escape') {
              event.preventDefault();
              dismissToast(toastId);
            }
          });
          
          // Auto-dismiss after duration if specified
          if (duration > 0) {
            setTimeout(function() {
              dismissToast(toastId);
            }, duration);
          }
          
          return toastId;
        }
        
        /**
         * Dismisses a toast by ID.
         * @param {string} toastId - ID of toast to dismiss
         */
        function dismissToast(toastId) {
          const toast = document.getElementById(toastId);
          if (!toast) return;
          
          // Add hiding animation
          toast.classList.add('hiding');
          
          // Remove from DOM after animation
          setTimeout(function() {
            if (toast.parentNode) {
              toast.parentNode.removeChild(toast);
            }
          }, 300);
        }
        
        /**
         * Shows storage full error toast.
         * Requirements: 12.1 - Display "Storage full" message
         */
        function showStorageFullError() {
          return showToast(
            'Storage full. Please delete old transactions.',
            'error',
            'Your browser\'s storage quota has been exceeded.',
            0 // Don't auto-dismiss
          );
        }
        
        /**
         * Shows storage unavailable banner.
         * Requirements: 12.1 - Display "Storage unavailable" banner
         */
        function showStorageUnavailableBanner() {
          const banner = document.getElementById('storage-banner');
          if (banner) {
            banner.classList.add('show');
          }
        }
        
        /**
         * Escapes HTML to prevent XSS.
         * @param {string} text - Text to escape
         * @returns {string} Escaped text
         */
        function escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }
        
        // Public API
        return {
          init: init,
          showToast: showToast,
          dismissToast: dismissToast,
          showStorageFullError: showStorageFullError,
          showStorageUnavailableBanner: showStorageUnavailableBanner
        };
      })();
      
      
      // ========================================
      // VALIDATOR MODULE
      // ========================================
      const Validator = (function() {
        /**
         * Validates transaction name field.
         * Requirements: 1.2 - Item Name must be 1-100 characters
         * @param {string} name - The transaction name to validate
         * @returns {{valid: boolean, error: string}} Validation result
         */
        function validateTransactionName(name) {
          const trimmed = name.trim();
          
          if (trimmed.length === 0) {
            return { valid: false, error: 'Item name cannot be empty' };
          }
          
          if (trimmed.length > 100) {
            return { valid: false, error: 'Item name cannot exceed 100 characters' };
          }
          
          return { valid: true, error: '' };
        }
        
        /**
         * Validates transaction amount field.
         * Requirements: 1.3 - Amount must be 0.01-999999999.99 with max 2 decimal places
         * @param {string|number} amount - The amount to validate
         * @returns {{valid: boolean, error: string}} Validation result
         */
        function validateAmount(amount) {
          const num = parseFloat(amount);
          
          if (isNaN(num)) {
            return { valid: false, error: 'Amount must be a number' };
          }
          
          if (num < 0.01) {
            return { valid: false, error: 'Amount must be at least 0.01' };
          }
          
          if (num > 999999999.99) {
            return { valid: false, error: 'Amount cannot exceed 999,999,999.99' };
          }
          
          // Check for max 2 decimal places using regex
          const amountStr = amount.toString();
          if (!/^\d+(\.\d{1,2})?$/.test(amountStr)) {
            return { valid: false, error: 'Amount can have at most 2 decimal places' };
          }
          
          return { valid: true, error: '' };
        }
        
        /**
         * Validates category selection.
         * Requirements: 1.4 - Category must be selected and exist
         * @param {string} category - The selected category
         * @param {Array<string>} categories - Array of available categories
         * @returns {{valid: boolean, error: string}} Validation result
         */
        function validateCategory(category, categories) {
          if (!category || category.trim() === '') {
            return { valid: false, error: 'Please select a category' };
          }
          
          if (!categories.includes(category)) {
            return { valid: false, error: 'Selected category does not exist' };
          }
          
          return { valid: true, error: '' };
        }
        
        /**
         * Validates new category name.
         * Requirements: 6.2 - Category name must be 1-50 characters, not whitespace-only, 
         * and unique (case-insensitive)
         * @param {string} name - The new category name to validate
         * @param {Array<string>} existingCategories - Array of existing categories
         * @returns {{valid: boolean, error: string}} Validation result
         */
        function validateCategoryName(name, existingCategories) {
          const trimmed = name.trim();
          
          // Check if empty or only whitespace
          if (trimmed.length === 0 || /^\s+$/.test(name)) {
            return { valid: false, error: 'Category name cannot be empty or only whitespace' };
          }
          
          if (trimmed.length > 50) {
            return { valid: false, error: 'Category name cannot exceed 50 characters' };
          }
          
          // Case-insensitive duplicate check
          const lowerName = trimmed.toLowerCase();
          if (existingCategories.some(cat => cat.toLowerCase() === lowerName)) {
            return { valid: false, error: 'Category already exists' };
          }
          
          return { valid: true, error: '' };
        }
        
        // Public API
        return {
          validateTransactionName: validateTransactionName,
          validateAmount: validateAmount,
          validateCategory: validateCategory,
          validateCategoryName: validateCategoryName
        };
      })();
      
      
      // ========================================
      // DATA MODEL MODULE
      // ========================================
      const DataModel = (function() {
        // State: transactions array and categories array
        let transactions = [];
        let categories = ['Food', 'Transport', 'Fun']; // Default categories (Requirement 6.1)
        
        // Event system: listeners object to store event callbacks
        const listeners = {};
        
        /**
         * Emits an event to all registered listeners.
         * @param {string} eventName - Name of the event to emit
         * @param {*} data - Data to pass to event handlers
         */
        function emit(eventName, data) {
          if (listeners[eventName]) {
            listeners[eventName].forEach(callback => {
              try {
                callback(data);
              } catch (e) {
                console.error(`Error in event listener for ${eventName}:`, e);
              }
            });
          }
        }
        
        /**
         * Registers an event listener.
         * @param {string} eventName - Name of the event to listen for
         * @param {Function} callback - Function to call when event is emitted
         */
        function on(eventName, callback) {
          if (!listeners[eventName]) {
            listeners[eventName] = [];
          }
          listeners[eventName].push(callback);
        }
        
        /**
         * Generates a UUID v4 for transaction IDs.
         * Uses random number generation following UUID v4 specification.
         * @returns {string} UUID v4 string
         */
        function generateId() {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        }
        
        /**
         * Adds a new transaction to the state.
         * Requirements: 1.6 - Add transaction within 1 second
         * @param {Object} transaction - Transaction data with name, amount, category
         * @returns {Object} The created transaction with id, timestamp, and date
         */
        function addTransaction(transaction) {
          const now = new Date();
          const newTransaction = {
            id: generateId(),
            name: transaction.name.trim(),
            amount: parseFloat(transaction.amount),
            category: transaction.category,
            date: now.toISOString(), // ISO 8601 format
            timestamp: now.getTime() // Unix timestamp for sorting
          };
          
          transactions.push(newTransaction);
          emit('transaction:added', newTransaction);
          return newTransaction;
        }
        
        /**
         * Deletes a transaction by ID.
         * Requirements: 2.4 - Remove from list and storage
         * @param {string} id - Transaction ID to delete
         * @returns {boolean} True if deleted, false if not found
         */
        function deleteTransaction(id) {
          const index = transactions.findIndex(t => t.id === id);
          if (index !== -1) {
            const deleted = transactions.splice(index, 1)[0];
            emit('transaction:deleted', deleted);
            return true;
          }
          return false;
        }
        
        /**
         * Gets all transactions sorted by timestamp (newest first).
         * Requirements: 2.1 - Display all saved transactions
         * @returns {Array<Object>} Sorted copy of transactions array
         */
        function getAllTransactions() {
          return [...transactions].sort((a, b) => b.timestamp - a.timestamp);
        }
        
        /**
         * Gets transactions filtered by month and year.
         * Requirements: 7.1 - Filter transactions by calendar month
         * @param {number} year - Year (e.g., 2024)
         * @param {number} month - Month (0-11, where 0 is January)
         * @returns {Array<Object>} Filtered transactions
         */
        function getTransactionsByMonth(year, month) {
          return transactions.filter(t => {
            const date = new Date(t.date);
            return date.getFullYear() === year && date.getMonth() === month;
          });
        }
        
        /**
         * Adds a new category to the categories list.
         * Requirements: 6.4 - Add to category list within 500ms
         * @param {string} name - Category name to add
         * @returns {boolean} True if added, false if already exists
         */
        function addCategory(name) {
          const trimmed = name.trim();
          // Check if category already exists (case-sensitive)
          if (!categories.includes(trimmed)) {
            categories.push(trimmed);
            emit('category:added', trimmed);
            return true;
          }
          return false;
        }
        
        /**
         * Gets all categories.
         * @returns {Array<string>} Copy of categories array
         */
        function getAllCategories() {
          return [...categories];
        }
        
        /**
         * Calculates total balance from all transactions.
         * Requirements: 3.1 - Sum of all transaction amounts
         * Requirements: 3.4 - Include negative amounts
         * Requirements: 3.5 - Return zero when empty
         * @returns {number} Total balance
         */
        function getTotalBalance() {
          return transactions.reduce((sum, t) => sum + t.amount, 0);
        }
        
        /**
         * Calculates total spending per category.
         * Requirements: 4.1 - Category spending distribution
         * Requirements: 4.7 - Handle uncategorized transactions
         * @returns {Object} Object mapping category names to total amounts
         */
        function getCategoryTotals() {
          const totals = {};
          transactions.forEach(t => {
            const cat = t.category || 'Uncategorized';
            totals[cat] = (totals[cat] || 0) + t.amount;
          });
          return totals;
        }
        
        /**
         * Loads data from StorageManager and restores state.
         * Requirements: 5.3 - Load saved transactions within 500ms
         * Requirements: 6.6 - Restore custom categories from storage
         * Requirements: 5.4 - Initialize with empty state if no data
         * Requirements: 12.3 - Fall back to defaults on data corruption
         * @returns {{transactionsLoaded: boolean, categoriesLoaded: boolean, errors: Array<string>}} Load result with status and errors
         */
        function loadData() {
          const errors = [];
          let transactionsLoaded = false;
          let categoriesLoaded = false;
          
          // Load transactions with corruption handling (Requirement 12.3)
          const transactionsResult = StorageManager.load('ebv_transactions_v1');
          
          if (transactionsResult.success && transactionsResult.data && Array.isArray(transactionsResult.data)) {
            // Valid transaction data loaded
            transactions = transactionsResult.data;
            transactionsLoaded = true;
            console.log('Loaded', transactions.length, 'transactions from storage');
          } else if (transactionsResult.success && !transactionsResult.data) {
            // No data in storage - initialize with empty array (Requirement 5.4)
            transactions = [];
            transactionsLoaded = true;
            console.log('No transactions in storage - initialized empty transaction list');
          } else {
            // Data corruption detected - fall back to empty array (Requirement 12.3)
            transactions = [];
            transactionsLoaded = false;
            const errorMsg = 'Transaction data corrupted: ' + (transactionsResult.error || 'Unknown error');
            errors.push(errorMsg);
            console.error(errorMsg);
            console.error('Falling back to empty transaction list');
            
            // Emit corruption event for UI notification
            emit('data:corrupted', {
              dataType: 'transactions',
              error: transactionsResult.error
            });
          }
          
          // Load categories with corruption handling (Requirement 12.3)
          const categoriesResult = StorageManager.load('ebv_categories_v1');
          
          if (categoriesResult.success && categoriesResult.data && Array.isArray(categoriesResult.data)) {
            // Valid category data loaded
            categories = categoriesResult.data;
            categoriesLoaded = true;
            console.log('Loaded', categories.length, 'categories from storage');
          } else if (categoriesResult.success && !categoriesResult.data) {
            // No data in storage - initialize with default categories (Requirement 6.1)
            categories = ['Food', 'Transport', 'Fun'];
            categoriesLoaded = true;
            console.log('No categories in storage - initialized with defaults:', categories);
          } else {
            // Data corruption detected - fall back to default categories (Requirement 12.3, 6.7)
            categories = ['Food', 'Transport', 'Fun'];
            categoriesLoaded = false;
            const errorMsg = 'Category data corrupted: ' + (categoriesResult.error || 'Unknown error');
            errors.push(errorMsg);
            console.error(errorMsg);
            console.error('Falling back to default categories:', categories);
            
            // Emit corruption event for UI notification
            emit('data:corrupted', {
              dataType: 'categories',
              error: categoriesResult.error
            });
          }
          
          // Emit data loaded event
          emit('data:loaded', {
            transactionsLoaded: transactionsLoaded,
            categoriesLoaded: categoriesLoaded,
            errors: errors
          });
          
          return {
            transactionsLoaded: transactionsLoaded,
            categoriesLoaded: categoriesLoaded,
            errors: errors
          };
        }
        
        /**
         * Saves current state to StorageManager.
         * Requirements: 5.1 - Save on add
         * Requirements: 5.2 - Save on delete
         * Requirements: 6.5 - Persist categories
         * Requirements: 12.1 - Emit error event on save failure
         */
        function saveData() {
          const transactionsSaved = StorageManager.save('ebv_transactions_v1', transactions);
          const categoriesSaved = StorageManager.save('ebv_categories_v1', categories);
          
          if (!transactionsSaved || !categoriesSaved) {
            console.error('Failed to save data to storage');
            emit('save:failed', {
              transactionsSaved: transactionsSaved,
              categoriesSaved: categoriesSaved
            });
            return false;
          }
          
          return true;
        }
        
        // Public API
        return {
          addTransaction: addTransaction,
          deleteTransaction: deleteTransaction,
          getAllTransactions: getAllTransactions,
          getTransactionsByMonth: getTransactionsByMonth,
          addCategory: addCategory,
          getAllCategories: getAllCategories,
          getTotalBalance: getTotalBalance,
          getCategoryTotals: getCategoryTotals,
          on: on,
          loadData: loadData,
          saveData: saveData
        };
      })();
      
      
      // ========================================

        function init(containerElement) {

          // Task 14.1: Create debounced validation functions (300ms delay)
          debouncedValidateName = Utils.debounce(function() {

              showError('name', validation.error);

            }
          }, 300);
          
          debouncedValidateAmount = Utils.debounce(function() {

            if (!validation.valid && amountInput.value !== '') {
              showError('amount', validation.error);
            } else {
              clearFieldError('amount');

          }, 300);
          
          debouncedValidateCategory = Utils.debounce(function() {

            if (!validation.valid && categorySelect.value !== '') {
              showError('category', validation.error);
            } else {
              clearFieldError('category');
            }
          }, 300);
          
          // Attach form submission handler
          formElement.addEventListener('submit', handleSubmit);
          
          // Task 14.1: Add debounced real-time validation on input events

        /**
         * Handles form submission with validation.

         * Requirements: 1.6 - Add transaction and clear form
         * Requirements: 12.1 - Preserve form input when storage save fails
         * Task 14.2: Add performance monitoring (1s budget for add transaction)
         * @param {Event} event - Form submit event
         */
        function handleSubmit(event) {
          event.preventDefault();
          
          // Task 14.2: Start performance measurement
          PerformanceMonitor.start('addTransaction');
          
          // Clear all previous errors
          clearErrors();
          
          // Get form values
          const name = nameInput.value;
          const amount = amountInput.value;
          const category = categorySelect.value;
          
          // Validate all fields
          const nameValidation = Validator.validateTransactionName(name);
          const amountValidation = Validator.validateAmount(amount);
          const categoryValidation = Validator.validateCategory(category, DataModel.getAllCategories());
          
          // Check if any validation failed
          let hasErrors = false;
          
          if (!nameValidation.valid) {
            showError('name', nameValidation.error);
            hasErrors = true;
          }
          
          if (!amountValidation.valid) {
            showError('amount', amountValidation.error);
            hasErrors = true;
          }
          
          if (!categoryValidation.valid) {

            hasErrors = true;
          }
          
          // If there are validation errors, don't submit
          if (hasErrors) {
            // Auto-focus on first error field for accessibility (Task 13.2)
            if (!nameValidation.valid) {
              nameInput.focus();
            } else if (!amountValidation.valid) {
              amountInput.focus();
            } else if (!categoryValidation.valid) {
              categorySelect.focus();
            }
            
            // Task 14.2: End measurement (validation failed)
            PerformanceMonitor.end('addTransaction', 'addTransaction');
            return;
          }
          
          // Disable submit button during validation to prevent double-submission
          submitButton.disabled = true;
          
          try {

              amount: amount,
              category: category
            };
            
            const addedTransaction = DataModel.addTransaction(transaction);

            if (saved) {
              // Save successful - reset form
              reset();

            }

            showError('name', 'Failed to add transaction. Please try again.');

            // Task 14.2: End performance measurement

         */
        function showError(fieldName, message) {
          const formGroup = formGroups[fieldName];
          if (!formGroup) return;
          
          const errorSpan = formGroup.querySelector('.error-message');
          if (errorSpan) {
            errorSpan.textContent = message;
            errorSpan.setAttribute('role', 'alert');
          }
          
          // Add error class to form group
          formGroup.classList.add('error');
          
          // Add aria-invalid to input
          const input = formGroup.querySelector('input, select');
          if (input) {
            input.setAttribute('aria-invalid', 'true');
          }
        }
        
        /**
         * Clears the error message for a specific field.
         * @param {string} fieldName - The field name ('name', 'amount', or 'category')
         */
        function clearFieldError(fieldName) {
          const formGroup = formGroups[fieldName];
          if (!formGroup) return;
          
          const errorSpan = formGroup.querySelector('.error-message');
          if (errorSpan) {
            errorSpan.textContent = '';
            errorSpan.removeAttribute('role');
          }
          
          // Remove error class from form group
          formGroup.classList.remove('error');
          
          // Remove aria-invalid from input
          const input = formGroup.querySelector('input, select');
          if (input) {
            input.removeAttribute('aria-invalid');
          }
        }
        
        /**
         * Clears all error messages from the form.

        // Public API

          reset: reset,
          showError: showError,

        };
      })();

        function render(transactions) {

            fragment.appendChild(item);

          // Task 14.1: Batch style changes - clear and insert in one operation

          });
          
          // Add Enter key handler for delete (Task 13.2)
          deleteBtn.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
              event.preventDefault();
              handleDelete(transaction.id, item);
            }
          });
          
          item.appendChild(deleteBtn);
          
          return item;
        }
        
        /**
         * Handles deletion of a transaction with smooth animation.
         * Requirements: 2.4 - Delete from list and storage
         * Requirements: 5.2 - Smooth fade-out animation
         * Requirements: 13.2 - Maintain focus management when removing elements
         * Task 14.2: Add performance monitoring (1s budget for delete transaction)
         * @param {string} id - Transaction ID to delete
         * @param {HTMLElement} itemElement - DOM element to animate
         */
        function handleDelete(id, itemElement) {
          // Task 14.2: Start performance measurement
          PerformanceMonitor.start('deleteTransaction');
          
          // Task 13.2: Store focus management info before deletion
          const currentlyFocused = document.activeElement;
          const deleteButton = itemElement.querySelector('.transaction-delete');
          const shouldManageFocus = (currentlyFocused === deleteButton);
          
          // Find next focusable element before deletion
          let nextFocusElement = null;
          if (shouldManageFocus) {
            const nextItem = itemElement.nextElementSibling;
            const prevItem = itemElement.previousElementSibling;
            
            if (nextItem && nextItem.classList.contains('transaction-item')) {
              nextFocusElement = nextItem.querySelector('.transaction-delete');
            } else if (prevItem && prevItem.classList.contains('transaction-item')) {
              nextFocusElement = prevItem.querySelector('.transaction-delete');
            } else {
              // No other transactions, focus will move to form
              nextFocusElement = document.querySelector('#item-name');
            }
          }
          
          // Add deleting class for fade-out animation
          itemElement.classList.add('deleting');
          
          // Wait for animation to complete (300ms as per CSS transition)
          setTimeout(function() {
            // Call DataModel to delete the transaction
            const success = DataModel.deleteTransaction(id);
            
            if (success) {
              // Save data to storage
              DataModel.saveData();
              
              // Task 13.2: Manage focus after deletion
              if (shouldManageFocus && nextFocusElement) {
                // Use setTimeout to ensure DOM is updated
                setTimeout(function() {
                  nextFocusElement.focus();
                }, 50);
              }
              
              // Task 14.2: End performance measurement
              PerformanceMonitor.end('deleteTransaction', 'deleteTransaction');
            } else {
              // If delete failed, remove the deleting class
              itemElement.classList.remove('deleting');
              // Show error message (Requirement 2.6)
              console.error('Failed to delete transaction');
              alert('Failed to delete transaction. Please try again.');
              
              // Task 14.2: End performance measurement
              PerformanceMonitor.end('deleteTransaction', 'deleteTransaction');
            }
          }, 300);
        }
        
        /**
         * Displays empty state message when no transactions exist.
         * Requirements: 2.5 - Empty state message

        function showEmpty() {
          if (!containerElement) {
            return;

              <span class="empty-icon">📝</span>
              <div>No transactions recorded</div>
              <div class="empty-hint">Start by adding one above!</div>
            </div>
          `;
        }
        
        // Public API
        return {

          render: render,
          showEmpty: showEmpty
        };

      // ========================================

      const PieChart = (function() {
        // Task 14.1: Cache DOM element references
        let canvasElement = null;

        let chartAvailable = true; // Track if Chart.js is available
        let lastCategoryTotals = null; // Task 14.1: Cache last data to avoid unnecessary re-renders
        
        // Color palette with 20 distinct colors for category differentiation (Requirement 4.4)
        const COLORS = [
          '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
          '#FF9F40', '#FF6384', '#C9CBCF', '#4BC0C0', '#FF9F40',
          '#36A2EB', '#FFCE56', '#9966FF', '#FF6384', '#4BC0C0',
          '#C9CBCF', '#FF9F40', '#36A2EB', '#FFCE56', '#9966FF'
        ];
        
        /**
         * Initializes the PieChart component.
         * Requirements: Store canvas reference and get 2D context
         * Task 12.2: Add try-catch wrapper around Chart.js initialization
         * @param {HTMLCanvasElement} canvas - The canvas element for rendering the chart
         */
        function init(canvas) {
          if (!canvas) {
            console.error('PieChart init failed: canvas element is null');
            return;
          }
          
          canvasElement = canvas;
          
          // Check if Chart.js is available (Requirements 10.2, 10.3 - Task 12.2)
          try {
            if (typeof Chart === 'undefined') {
              throw new Error('Chart.js library not loaded');
            }
            
            // Verify Chart constructor is accessible
            if (typeof Chart !== 'function') {
              throw new Error('Chart.js constructor not available');
            }
            
            chartAvailable = true;
            console.log('PieChart component initialized with Chart.js');
          } catch (error) {
            console.error('Chart.js initialization failed:', error);
            chartAvailable = false;
            showErrorState('Chart library could not load');
            hideChartSection();
            return;
          }
          
          // Subscribe to data change events (Requirements 4.2, 4.3)
          DataModel.on('transaction:added', function() {
            update(DataModel.getCategoryTotals());
          });
          
          DataModel.on('transaction:deleted', function() {
            update(DataModel.getCategoryTotals());
          });
          
          // Initial render
          update(DataModel.getCategoryTotals());
