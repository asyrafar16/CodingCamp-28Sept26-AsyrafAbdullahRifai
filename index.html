        /**
         * Updates the pie chart with new category totals.
         * Requirements: 4.1 (render with percentages), 4.2 (update on add), 4.3 (update on delete)
         * Task 12.2: Enhanced error handling for Chart.js failures
         * Task 14.1: Avoid unnecessary chart re-renders by checking if data actually changed
         * @param {Object} categoryTotals - Object mapping category names to amounts
         */
        function update(categoryTotals) {
          if (!canvasElement) {
            console.warn('PieChart update skipped: not initialized');
            return;
          }
          
          // Skip if Chart.js is not available (Task 12.2)
          if (!chartAvailable) {
            console.warn('PieChart update skipped: Chart.js not available');
            return;
          }
          
          // Task 14.1: Check if data actually changed before re-rendering
          if (hasDataChanged(categoryTotals)) {
            console.log('[PieChart] Data changed, updating chart');
            // Store new data for next comparison
            lastCategoryTotals = JSON.parse(JSON.stringify(categoryTotals));
          } else {
            console.log('[PieChart] Data unchanged, skipping chart update');
            return;
          }
          
          // Verify Chart.js is still accessible
          if (typeof Chart === 'undefined') {
            console.error('Chart.js no longer available');
            chartAvailable = false;
            showErrorState('Chart library could not load');
            hideChartSection();
            return;
          }
          
          const categories = Object.keys(categoryTotals);
          const amounts = Object.values(categoryTotals);
          const total = amounts.reduce((sum, val) => sum + val, 0);
          
          // Destroy existing chart instance before creating new one (as per design)
          try {
            if (chartInstance) {
              chartInstance.destroy();
              chartInstance = null;
            }
          } catch (error) {
            console.error('Failed to destroy existing chart:', error);
            chartInstance = null;
          }
          
          // Handle empty state - no spending data (Requirement 4.6)
          if (total === 0 || categories.length === 0) {
            showEmptyState('No spending data available');
            return;
          }
          
          // Ensure canvas is visible (remove empty state)
          canvasElement.style.display = 'block';
          const parent = canvasElement.parentElement;
          if (parent) {
            const emptyStateDiv = parent.querySelector('.chart-empty-state');
            if (emptyStateDiv) {
              emptyStateDiv.remove();
            }
          }
          
          // Generate colors for categories
          const backgroundColors = categories.map((_, i) => COLORS[i % COLORS.length]);
          
          // Task 12.2: Wrap Chart.js initialization in try-catch
          try {
            // Create new Chart.js pie chart
            chartInstance = new Chart(canvasElement, {
              type: 'pie',
              data: {
                labels: categories,
                datasets: [{
                  data: amounts,
                  backgroundColor: backgroundColors,
                  borderWidth: 2,
                  borderColor: getComputedStyle(document.documentElement)
                    .getPropertyValue('--bg-primary').trim() || '#ffffff'
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: {
                    position: 'right',
                    labels: {
                      // Customize legend to show category name and percentage (Requirement 4.5)
                      generateLabels: function(chart) {
                        const data = chart.data;
                        if (!data.labels || !data.datasets || !data.datasets[0]) {
                          return [];
                        }
                        
                        return data.labels.map((label, i) => {
                          const value = data.datasets[0].data[i];
                          const percentage = ((value / total) * 100).toFixed(1);
                          
                          return {
                            text: `${label}: ${percentage}%`,
                            fillStyle: data.datasets[0].backgroundColor[i],
                            hidden: false,
                            index: i
                          };
                        });
                      },
                      color: getComputedStyle(document.documentElement)
                        .getPropertyValue('--text-primary').trim(),
                      font: {
                        size: 14
                      },
                      padding: 10
                    }
                  },
                  tooltip: {
                    // Customize tooltip to show category, dollar amount, and percentage
                    callbacks: {
                      label: function(context) {
                        const label = context.label || '';
                        const value = context.parsed || 0;
                        const percentage = ((value / total) * 100).toFixed(1);
                        return `${label}: $${value.toFixed(2)} (${percentage}%)`;
                      }
                    },
                    backgroundColor: getComputedStyle(document.documentElement)
                      .getPropertyValue('--bg-secondary').trim(),
                    titleColor: getComputedStyle(document.documentElement)
                      .getPropertyValue('--text-primary').trim(),
                    bodyColor: getComputedStyle(document.documentElement)
                      .getPropertyValue('--text-primary').trim(),
                    borderColor: getComputedStyle(document.documentElement)
                      .getPropertyValue('--border-color').trim(),
                    borderWidth: 1
                  }
                }
              }
            });
            
            console.log('PieChart updated with', categories.length, 'categories');
          } catch (error) {
            // Task 12.2: Enhanced error handling for Chart.js failures
            console.error('Failed to create chart:', error);
            chartAvailable = false;
            showErrorState('Chart library could not load');
            hideChartSection();
          }
        }
        
        /**
         * Checks if category data has changed since last render.
         * Task 14.1: Avoid unnecessary chart re-renders by checking if data actually changed
         * 
         * @param {Object} newCategoryTotals - New category totals to compare
         * @returns {boolean} True if data has changed, false otherwise
         */
        function hasDataChanged(newCategoryTotals) {
          // If no previous data, data has "changed" (first render)
          if (!lastCategoryTotals) {
            return true;
          }
          
          // Compare JSON representations for deep equality
          const newJson = JSON.stringify(newCategoryTotals);
          const oldJson = JSON.stringify(lastCategoryTotals);
          
          return newJson !== oldJson;
        }
        
        /**
         * Displays an empty state message when no data is available.
         * Requirements: 4.6 (empty state message)
         * @param {string} message - The message to display
         */
        function showEmptyState(message) {
          if (!canvasElement) return;
          
          // Hide the canvas
          canvasElement.style.display = 'none';
          
          // Create or update empty state div
          const parent = canvasElement.parentElement;
          if (!parent) return;
          
          let emptyStateDiv = parent.querySelector('.chart-empty-state');
          
          if (!emptyStateDiv) {
            emptyStateDiv = document.createElement('div');
            emptyStateDiv.className = 'chart-empty-state';
            parent.appendChild(emptyStateDiv);

          emptyStateDiv.innerHTML = `
            <span class="empty-icon">📊</span>
            <p>${message}</p>
            <p class="empty-hint">Add your first transaction to see the chart</p>
          `;
        }
        
        /**
         * Displays an error state message when Chart.js fails to load.
         * Task 12.2: Show "Chart library could not load" message
         * Requirements: 10.2, 10.3 - Ensure app continues to function without chart

            <p>${message}</p>
            <p class="empty-hint">The chart feature is unavailable, but you can still track your expenses</p>
          `;
          
          console.warn('Chart error state displayed:', message);
        }
        
        /**
         * Hides the chart section gracefully when Chart.js is unavailable.
         * Task 12.2: Hide chart section to avoid confusion
         * Requirements: 10.3 - Rest of application continues to function
         */
        function hideChartSection() {
          if (!canvasElement) return;
          
          const chartSection = canvasElement.closest('#chart-section');
          if (chartSection) {

            chartSection.style.opacity = '0.6';

            console.log('Chart section hidden gracefully due to Chart.js unavailability');
          }

        /**

         */
        function destroy() {
          try {
            if (chartInstance) {
              chartInstance.destroy();
              chartInstance = null;

          } catch (error) {
            console.error('Failed to destroy chart instance:', error);

        // Public API

          update: update,
          destroy: destroy

      // ========================================
      // MONTHLY SUMMARY COMPONENT
      // ========================================
      const MonthlySummary = (function() {
        
        let containerElement = null;
        let monthSelectElement = null;
        let summaryContentElement = null;
        let currentYear = null;
        let currentMonth = null;
        
        /**
         * Initializes the MonthlySummary component.
         * Requirements: 7.4 (accessible without reload), 7.5 (default to current month)
         * @param {HTMLElement} container - The container element for the monthly summary
         */
        function init(container) {
          if (!container) {
            console.error('MonthlySummary init failed: container element is null');
            return;
          }
          
          containerElement = container;
          monthSelectElement = container.querySelector('#month-select');
          summaryContentElement = container.querySelector('#monthly-summary-content');
          
          if (!monthSelectElement || !summaryContentElement) {
            console.error('MonthlySummary: Required UI elements not found');
            return;
          }
          
          // Populate month selector with available months (Requirements: 7.5 default to current month)
          populateMonthSelector();
          
          // Default to current calendar month (Requirement 7.5)
          const now = new Date();
          currentYear = now.getFullYear();
          currentMonth = now.getMonth(); // 0-11
          
          // Select current month in dropdown if it exists
          const currentValue = `${currentYear}-${currentMonth}`;
          if (Array.from(monthSelectElement.options).some(opt => opt.value === currentValue)) {
            monthSelectElement.value = currentValue;
          } else if (monthSelectElement.options.length > 0) {
            // If current month not in list, select first available
            const firstValue = monthSelectElement.options[0].value;
            if (firstValue) {
              const [year, month] = firstValue.split('-').map(Number);
              currentYear = year;
              currentMonth = month;
              monthSelectElement.value = firstValue;
            }
          }
          
          // Add event listener for month selection change (Requirement 7.2)
          monthSelectElement.addEventListener('change', handleMonthChange);
          
          // Subscribe to transaction events to refresh available months (Requirement: Subscribe to events)
          DataModel.on('transaction:added', function() {
            populateMonthSelector();
            renderSummary();
          });
          
          DataModel.on('transaction:deleted', function() {
            populateMonthSelector();
            renderSummary();
          });
          
          console.log('MonthlySummary component initialized');
          
          // Initial render
          renderSummary();
        }
        
        /**
         * Populates the month selector dropdown with all months that have transactions.
         * Requirements: Populate month selector with all months that have transactions
         */
        function populateMonthSelector() {
          if (!monthSelectElement) {
            return;
          }
          
          const transactions = DataModel.getAllTransactions();
          const monthsSet = new Set();
          
          // Extract unique year-month combinations from transactions
          transactions.forEach(t => {
            const date = new Date(t.date);
            const year = date.getFullYear();
            const month = date.getMonth(); // 0-11
            monthsSet.add(`${year}-${month}`);
          });
          
          // Convert to array and sort (newest first)
          const months = Array.from(monthsSet).sort((a, b) => {
            const [yearA, monthA] = a.split('-').map(Number);
            const [yearB, monthB] = b.split('-').map(Number);
            if (yearA !== yearB) return yearB - yearA; // Newer year first
            return monthB - monthA; // Newer month first
          });
          
          // Store current selection
          const currentSelection = monthSelectElement.value;
          
          // Clear and repopulate
          monthSelectElement.innerHTML = '';
          
          if (months.length === 0) {
            // Add current month as default option even if no transactions
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const option = document.createElement('option');
            option.value = `${year}-${month}`;
            option.textContent = formatMonthYear(year, month);
            monthSelectElement.appendChild(option);
          } else {
            months.forEach(monthKey => {
              const [year, month] = monthKey.split('-').map(Number);
              const option = document.createElement('option');
              option.value = monthKey;
              option.textContent = formatMonthYear(year, month);
              monthSelectElement.appendChild(option);
            });
          }
          
          // Restore selection if it still exists
          if (currentSelection && Array.from(monthSelectElement.options).some(opt => opt.value === currentSelection)) {
            monthSelectElement.value = currentSelection;
          } else if (monthSelectElement.options.length > 0) {
            // Otherwise select first option
            monthSelectElement.selectedIndex = 0;
          }
        }
        
        /**
         * Formats year and month as readable string.
         * @param {number} year - Full year (e.g., 2024)
         * @param {number} month - Month index (0-11)
         * @returns {string} Formatted month and year (e.g., "January 2024")
         */
        function formatMonthYear(year, month) {
          const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
          ];
          return `${monthNames[month]} ${year}`;
        }
        
        /**
         * Handles month selection change event.
         * Requirements: 7.2 (recalculate on month selection)
         */
        function handleMonthChange() {
          if (!monthSelectElement || !monthSelectElement.value) {
            return;
          }
          
          const [year, month] = monthSelectElement.value.split('-').map(Number);
          selectMonth(year, month);
        }
        
        /**
         * Selects a specific month and renders the summary.
         * Requirements: 7.2 (recalculate on month selection)
         * @param {number} year - Full year (e.g., 2024)
         * @param {number} month - Month index (0-11)
         */
        function selectMonth(year, month) {
          currentYear = year;
          currentMonth = month;
          renderSummary();
        }
        
        /**
         * Renders the monthly summary with category totals and visual bars.
         * Requirements: 7.1 (sum per category), 7.3 (empty state), 7.6 (exclude zero/negative)
         */
        function renderSummary() {
          if (!summaryContentElement) {
            return;
          }
          
          // Get transactions for selected month (Requirement: Call DataModel.getTransactionsByMonth)
          const transactions = DataModel.getTransactionsByMonth(currentYear, currentMonth);
          
          // Calculate category totals, excluding zero/negative amounts (Requirement 7.6)
          const categoryTotals = {};
          let grandTotal = 0;
          
          transactions.forEach(t => {
            // Exclude zero or negative amounts (Requirement 7.6)
            if (t.amount > 0) {
              const category = t.category || 'Uncategorized';
              categoryTotals[category] = (categoryTotals[category] || 0) + t.amount;
              grandTotal += t.amount;
            }
          });
          
          const categories = Object.keys(categoryTotals);
          
          // Check for empty state (Requirement 7.3)
          if (categories.length === 0 || grandTotal === 0) {
            showEmptyState();
            return;
          }
          
          // Sort categories by amount (highest first)
          categories.sort((a, b) => categoryTotals[b] - categoryTotals[a]);
          
          // Build summary HTML with visual bars (Requirements: Display totals with bars)
          let html = '<div class="summary-content">';
          
          categories.forEach(category => {
            const amount = categoryTotals[category];
            const percentage = (amount / grandTotal) * 100;
            
            html += `
              <div class="summary-category-row">
                <div class="summary-category-header">
                  <span class="summary-category-name">${escapeHtml(category)}</span>
                  <span class="summary-category-amount">$${formatCurrency(amount)}</span>
                </div>
                <div class="summary-category-bar">
                  <div class="summary-category-bar-fill" style="width: ${percentage}%"></div>
                </div>
              </div>
            `;
          });
          
          // Add grand total row (Requirement: Display grand total)
          html += `
            <div class="summary-total-row">
              <span class="summary-total-label">Total</span>
              <span class="summary-total-amount">$${formatCurrency(grandTotal)}</span>
            </div>
          `;
          
          html += '</div>';
          
          summaryContentElement.innerHTML = html;
        }
        
        /**
         * Shows empty state message when no data exists.
         * Requirements: 7.3 (empty state message)
         */
        function showEmptyState() {
          if (!summaryContentElement) {
            return;
          }
          
          summaryContentElement.innerHTML = `
            <div class="summary-empty-state">
              <span class="empty-icon">📊</span>
              <p>No expenses recorded for this month</p>
            </div>
          `;
        }
        
        /**
         * Shows the monthly summary section.
         * Requirements: Implement show() function
         */
        function show() {
          if (containerElement) {
            containerElement.style.display = 'block';
          }
        }
        
        /**
         * Hides the monthly summary section.
         * Requirements: Implement hide() function
         */
        function hide() {
          if (containerElement) {
            containerElement.style.display = 'none';
          }
        }
        
        /**
         * Formats a number as currency with 2 decimal places and thousands separators.
         * @param {number} amount - The amount to format
         * @returns {string} Formatted currency string
         */
        function formatCurrency(amount) {
          return amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        /**
         * Escapes HTML special characters to prevent XSS.
         * @param {string} text - The text to escape
         * @returns {string} Escaped text
         */
        function escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }
        
        // Public API
        return {
          init: init,
          selectMonth: selectMonth,
          show: show,
          hide: hide
        };
      })();
      
      
      // ========================================
      // THEME TOGGLE COMPONENT
      // ========================================
      const ThemeToggle = (function() {
        const STORAGE_KEY = 'ebv_theme_v1';
        const DEFAULT_THEME = 'light'; // Requirement 8.4
        let currentTheme = DEFAULT_THEME;
        let buttonElement = null;
        let sunIcon = null;
        let moonIcon = null;
        
        /**
         * Initializes the ThemeToggle component.
         * Requirements: 8.3 (restore from storage), 8.4 (default to light)
         * @param {HTMLElement} button - The theme toggle button element
         */
        function init(button) {
          if (!button) {
            console.error('ThemeToggle init failed: button element is null');
            return;
          }
          
          buttonElement = button;
          sunIcon = button.querySelector('.icon-sun');
          moonIcon = button.querySelector('.icon-moon');
          
          if (!sunIcon || !moonIcon) {
            console.warn('ThemeToggle: Icon elements not found in button');
          }
          
          // Load saved theme preference from storage (Requirement 8.3)
          const savedTheme = StorageManager.load(STORAGE_KEY);
          if (savedTheme && (savedTheme === 'light' || savedTheme === 'dark')) {
            currentTheme = savedTheme;
          } else {
            // Default to light theme if no preference exists (Requirement 8.4)
            currentTheme = DEFAULT_THEME;
          }
          
          // Apply saved theme before first render to prevent flash (Requirement: Apply before first render)
          setTheme(currentTheme);
          
          // Attach event listener for theme toggle
          buttonElement.addEventListener('click', toggleTheme);
          
          // Add Enter and Space key support for theme toggle (Task 13.2)
          buttonElement.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              toggleTheme();
            }
          });
          
          console.log('ThemeToggle component initialized with theme:', currentTheme);
        }
        
        /**
         * Sets the theme by updating the data-theme attribute on the HTML element.
         * Requirements: 8.1 (switch between themes), 8.2 (apply within 300ms)
         * @param {string} theme - The theme to apply ('light' or 'dark')
         */
        function setTheme(theme) {
          if (theme !== 'light' && theme !== 'dark') {
            console.error('Invalid theme:', theme);
            return;
          }
          
          // Set data-theme attribute on <html> element (Requirement: Set data-theme attribute)
          document.documentElement.setAttribute('data-theme', theme);
          
          currentTheme = theme;
          
          // Update sun/moon icon visibility based on current theme
          updateIconVisibility(theme);
          
          // Note: CSS transition handles the 300ms requirement (Requirement 8.2)
          // via --transition-speed: 300ms CSS custom property
        }
        
        /**
         * Toggles between light and dark themes.
         * Requirements: 8.1 (switch between themes), 8.5 (persist to storage)
         */
        function toggleTheme() {
          // Toggle between light and dark (Requirement: Toggle between "light" and "dark")
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          
          // Apply the new theme
          setTheme(newTheme);
          
          // Save theme preference to Local Storage (Requirement 8.5)
          const saved = StorageManager.save(STORAGE_KEY, newTheme);
          
          if (!saved) {
            console.warn('Failed to save theme preference to storage');
          }
        }
        
        /**
         * Updates the visibility of sun/moon icons based on the current theme.
         * Requirements: Update sun/moon icon visibility
         * @param {string} theme - The current theme ('light' or 'dark')
         */
        function updateIconVisibility(theme) {
          if (!sunIcon || !moonIcon) {
            return;
          }
          
          // In light mode: show moon icon (to switch to dark)
          // In dark mode: show sun icon (to switch to light)
          // Note: CSS handles this via [data-theme="dark"] selectors
          // This function is kept for explicit programmatic control if needed
          
          // The CSS already handles icon visibility:
          // .icon-moon { display: none; }
          // [data-theme="dark"] .icon-sun { display: none; }
          // [data-theme="dark"] .icon-moon { display: inline; }
          
          // No explicit style changes needed here as CSS handles it automatically
          // based on the data-theme attribute we set in setTheme()
        }
        
        /**
         * Gets the current theme.
         * @returns {string} The current theme ('light' or 'dark')
         */
        function getTheme() {
          return currentTheme;
        }
        
        // Public API
        return {
          init: init,
          setTheme: setTheme,
          toggleTheme: toggleTheme,
          getTheme: getTheme
        };
      })();
      
      
      // ========================================
      // APP CONTROLLER MODULE
      // ========================================
      const AppController = (function() {
        
        /**
         * Initializes the application.
         * Requirements:
         * - 5.3: Load data from Local Storage within 500ms
         * - 9.1: Render initial page within 2 seconds
         * - 9.2: Update UI within 300ms after actions
         * - 12.1: Initialize storage error handling
         * Task 14.2: Add loading indicator during initial data load if >500ms
         * Task 14.2: Implement timeout for initial load (10 seconds) with error message
         * Task 14.2: Add performance monitoring for initial load (2s budget)
         * 
         * This function orchestrates application startup by:
         * 1. Initializing notification system
         * 2. Checking storage availability and showing banner if unavailable
         * 3. Loading saved data from Local Storage
         * 4. Initializing all UI components with their DOM element references
         * 5. Setting up event listeners by subscribing to DataModel events
         * 6. Performing initial render of all components
         */
        function init() {
          // Task 14.2: Start performance measurement for initial load
          PerformanceMonitor.start('initialLoad');
          
          // Task 14.2: Set up loading indicator timer (show after 500ms)
          let loadingTimeout = setTimeout(function() {
            showLoadingIndicator();
          }, 500);
          
          // Task 14.2: Set up init timeout (10 seconds max)
          let initTimeout = setTimeout(function() {
            hideLoadingIndicator();
            showInitError();
            PerformanceMonitor.end('initialLoad', 'initialLoad');
          }, 10000);
          
          try {
            // Initialize NotificationManager (Requirement 12.1)
            NotificationManager.init();
            
            // Check storage availability and show banner if unavailable (Requirement 12.1)
            if (!StorageManager.isAvailable()) {
              NotificationManager.showStorageUnavailableBanner();
            }
            
            // Set up storage error listeners (Requirement 12.1)
            StorageManager.on('quota-exceeded', function(data) {
              NotificationManager.showStorageFullError();
            });
            
            StorageManager.on('unavailable', function(data) {
              NotificationManager.showToast(
                'Storage operation failed',
                'error',
                'Local Storage is not available. Data cannot be saved.',
                0
              );
            });
            
            // Listen for save failures from DataModel (Requirement 12.1)
            DataModel.on('save:failed', function(data) {
              console.error('DataModel save failed:', data);
              // Don't show toast here as StorageManager already emitted the specific error
            });
            
            // Initialize ThemeToggle FIRST to apply saved theme before rendering
            // Requirements: 8.3 (restore from storage before first render)
            const themeToggleButton = document.getElementById('theme-toggle');
            if (themeToggleButton) {
              ThemeToggle.init(themeToggleButton);
            }
            
            // Task 14.2: Measure data load time separately
            PerformanceMonitor.start('dataLoad');
            
            // Load data from storage (Requirement 5.3: within 500ms)
            DataModel.loadData();
            
            // Task 14.2: End data load measurement
            PerformanceMonitor.end('dataLoad', 'dataLoad');
            
            // Initialize all UI components with their DOM element references
            const formElement = document.getElementById('transaction-form');
            if (formElement) {
              TransactionForm.init(formElement);
            }
            
            const balanceContainer = document.getElementById('balance-display');
            if (balanceContainer) {
              BalanceDisplay.init(balanceContainer);
            }
            
            const listContainer = document.getElementById('transaction-list');
            if (listContainer) {
              TransactionList.init(listContainer);
            }
            
            const chartCanvas = document.getElementById('pie-chart');
            if (chartCanvas) {
              PieChart.init(chartCanvas);
            }
            
            const categorySection = document.getElementById('category-section');
            if (categorySection) {
              CategoryManager.init(categorySection);
            }
            
            const summarySection = document.getElementById('summary-section');
            if (summarySection) {
              MonthlySummary.init(summarySection);
            }
            
            // Set up event listeners by subscribing to DataModel events
            DataModel.on('transaction:added', handleTransactionAdded);
            DataModel.on('transaction:deleted', handleTransactionDeleted);
            DataModel.on('category:added', handleCategoryAdded);
            
            // Listen for data corruption events (Requirement 12.3)
            DataModel.on('data:corrupted', handleDataCorruption);
            
            // Initial render of all UI components (Requirement 9.1: within 2 seconds)
            renderAll();
            
            // Task 14.2: Clear timers and hide loading indicator
            clearTimeout(loadingTimeout);
            clearTimeout(initTimeout);
            hideLoadingIndicator();
            
            // Task 14.2: End performance measurement
            PerformanceMonitor.end('initialLoad', 'initialLoad');
            
            console.log('[AppController] Initialization complete');
          } catch (error) {
            // Task 14.2: Handle initialization errors
            console.error('[AppController] Initialization failed:', error);
            clearTimeout(loadingTimeout);
            clearTimeout(initTimeout);
            hideLoadingIndicator();
            showInitError();
            PerformanceMonitor.end('initialLoad', 'initialLoad');
          }
        }
        
        /**
         * Shows loading indicator during initial data load.
         * Task 14.2: Display loading indicator if initial load takes >500ms
         */
        function showLoadingIndicator() {
          const appMain = document.querySelector('.app-main');
          if (!appMain) return;
          
          // Create loading overlay
          let loadingOverlay = document.getElementById('loading-overlay');
          
          if (!loadingOverlay) {
            loadingOverlay = document.createElement('div');
            loadingOverlay.id = 'loading-overlay';
            loadingOverlay.style.cssText = `
              position: fixed;
              top: 0;
              left: 0;
              right: 0;
              bottom: 0;
              background: var(--bg-primary);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              z-index: 9999;
              opacity: 0.95;
            `;
            
            loadingOverlay.innerHTML = `
              <div style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 1.5s ease-in-out infinite;">⏳</div>
              <div style="font-size: 1.25rem; color: var(--text-primary); font-weight: 500;">Loading your data...</div>
            `;
            
            // Add pulse animation
            const style = document.createElement('style');
            style.textContent = `
              @keyframes pulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.5; transform: scale(1.1); }
              }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(loadingOverlay);
          }
          
          loadingOverlay.style.display = 'flex';
          console.log('[AppController] Loading indicator shown');
        }
        
        /**
         * Hides loading indicator.
         * Task 14.2: Hide loading indicator when initialization completes
         */
        function hideLoadingIndicator() {
          const loadingOverlay = document.getElementById('loading-overlay');
          if (loadingOverlay) {
            loadingOverlay.style.display = 'none';
            console.log('[AppController] Loading indicator hidden');
          }
        }
        
        /**
         * Shows initialization error message.
         * Task 14.2: Show error message if initialization exceeds 10 second timeout
         * Requirements: 9.3 (display loading indicator on failure)
         */
        function showInitError() {
          console.error('[AppController] Initialization timeout or error');
          
          // Show error notification
          if (typeof NotificationManager !== 'undefined' && NotificationManager.showToast) {
            NotificationManager.showToast(
              'Application Loading Failed',
              'error',
              'The application failed to load within 10 seconds. Please refresh the page.',
              0  // Persistent
            );
          }
          
          // Show error message in main area
          const appMain = document.querySelector('.app-main');
          if (appMain) {
            appMain.innerHTML = `
              <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                <span style="font-size: 4rem; display: block; margin-bottom: 1rem;">⚠️</span>
                <h2 style="color: var(--error-color); margin-bottom: 1rem;">Loading Failed</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                  The application failed to load properly. This may be due to a slow connection or technical issue.
                </p>
                <button class="btn-primary" onclick="location.reload()">Refresh Page</button>
              </div>
            `;
          }
        }
        
        /**
         * Handles transaction:added event.
         * Saves data to storage and triggers re-render of all UI components.
         * Requirement 9.2: Update UI within 300ms
         * Requirement 12.1: Handle storage save failures
         * 
         * @param {Object} transaction - The newly added transaction
         */
        function handleTransactionAdded(transaction) {
          // Save data to Local Storage
          const saved = DataModel.saveData();
          
          if (!saved) {
            console.error('Failed to save transaction to storage');
            // Show error notification (StorageManager already emitted the error)
            // Form input is preserved (NOT cleared) - handled in TransactionForm
          }
          
          // Trigger re-render of all UI components
          renderAll();
        }
        
        /**
         * Handles transaction:deleted event.
         * Saves data to storage and triggers re-render of all UI components.
         * Requirement 9.2: Update UI within 300ms
         * Requirement 12.1: Handle storage save failures
         * 
         * @param {Object} transaction - The deleted transaction
         */
        function handleTransactionDeleted(transaction) {
          // Save data to Local Storage
          const saved = DataModel.saveData();
          
          if (!saved) {
            console.error('Failed to save after deletion to storage');
            // Show error notification (StorageManager already emitted the error)
          }
          
          // Trigger re-render of all UI components
          renderAll();
        }
        
        /**
         * Handles category:added event.
         * Saves data to storage and refreshes the form dropdown.
         * Requirement 6.4: Add category to selection list within 500ms
         * Requirement 12.1: Handle storage save failures
         * 
         * @param {string} category - The newly added category name
         */
        function handleCategoryAdded(category) {
          // Save data to Local Storage
          const saved = DataModel.saveData();
          
          if (!saved) {
            console.error('Failed to save category to storage');
            // Show error notification (StorageManager already emitted the error)
          }
          
          // Refresh form dropdown to include the new category
          if (typeof TransactionForm !== 'undefined' && TransactionForm.refreshCategories) {
            TransactionForm.refreshCategories();
          }
        }
        
        /**
         * Handles data:corrupted event from DataModel.
         * Displays error message to user when saved data cannot be restored.
         * Requirement 12.3: Display error message to user when saved data cannot be restored
         * 
         * @param {Object} data - Corruption event data containing dataType and error
         */
        function handleDataCorruption(data) {
          console.error('Data corruption detected:', data);
          
          // Construct user-friendly error message
          let message = '';
          if (data.dataType === 'transactions') {
            message = 'Saved transaction data could not be restored due to corruption. Starting with empty transaction list.';
          } else if (data.dataType === 'categories') {
            message = 'Saved category data could not be restored due to corruption. Using default categories (Food, Transport, Fun).';
          } else {
            message = 'Saved data could not be restored due to corruption. Some data may have been reset to defaults.';
          }
          
          // Show persistent error notification to user (Requirement 12.3)
          if (typeof NotificationManager !== 'undefined' && NotificationManager.showToast) {
            NotificationManager.showToast(
              'Data Restoration Error',
              'error',
              message,
              0  // 0 = persistent (requires manual dismissal)
            );
          } else {
            // Fallback: log to console if NotificationManager not available
            console.error('Cannot show UI notification:', message);
          }
        }
        
        /**
         * Updates all UI components to reflect current data state.
         * This function is called after any data change to ensure UI consistency.
         * Requirement 9.2: Complete update within 300ms
         * Task 14.2: Add performance monitoring (300ms budget for UI update)
         * 
         * Components updated:
         * - TransactionList: Display all transactions
         * - BalanceDisplay: Show total spending
         * - PieChart: Visualize category distribution
         * - MonthlySummary: Show monthly breakdown
         */
        function renderAll() {
          // Task 14.2: Start performance measurement for UI update
          PerformanceMonitor.start('uiUpdate');
          
          // Update transaction list
          if (typeof TransactionList !== 'undefined') {
            TransactionList.render(DataModel.getAllTransactions());
          }
          
          // Update balance display
          if (typeof BalanceDisplay !== 'undefined') {
            BalanceDisplay.update(DataModel.getTotalBalance());
          }
          
          // Update pie chart
          if (typeof PieChart !== 'undefined') {
            PieChart.update(DataModel.getCategoryTotals());
          }
          
          // Update monthly summary
          if (typeof MonthlySummary !== 'undefined' && MonthlySummary.refresh) {
            MonthlySummary.refresh();
          }
          
          // Task 14.2: End performance measurement
          PerformanceMonitor.end('uiUpdate', 'uiUpdate');
        }
        
        // Public API
        return {
          init: init
        };
      })();
      
      
      // ========================================
      // INITIALIZATION
      // ========================================
      // Add DOMContentLoaded event listener to call AppController.init() when document is ready
      // This ensures all DOM elements are available before initialization
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', AppController.init);
      } else {
        // Document is already loaded, initialize immediately
        AppController.init();
      }
      
    })();
  </script>
</body>
</html>
